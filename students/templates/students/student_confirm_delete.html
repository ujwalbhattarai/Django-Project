{% extends "students/base.html" %}

{% block title %}
    Delete Student
{% endblock %}

{% block content %}

    <h2>Delete Student</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ student.name }}</strong>?
    </p>

    {% if perms.students.delete_student %}

        <form method="post">

            {% csrf_token %}

        <button type="submit">
            Delete
        </button>

        </form>

    {% endif %}

    <a href="{% url 'students:student-list' %}">
        Cancel
    </a>

{% endblock %}
