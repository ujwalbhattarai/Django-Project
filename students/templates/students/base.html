<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Student Management System{% endblock %}</title>
</head>

<body>

    <header>
        <h1>Student Management System</h1>

        <nav>
            <a href="{% url 'students:student-list' %}">
                Students
            </a>

            |

            <a href="{% url 'accounts:logout' %}">
                Logout
            </a>
        </nav>

    </header>

    {% if messages %}

    {% for message in messages %}

        <p>
            {{ message }}
        </p>

    {% endfor %}

{% endif %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
