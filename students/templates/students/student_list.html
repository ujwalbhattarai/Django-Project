<!DOCTYPE html>
<html>
<head>
    <title>Students</title>
</head>
<body>

    <h1>Student Management System</h1>

    <h2>Students</h2>

    <p>Total students: {{ students|length }}</p>

    {% for student in students %}

        <div>

            <p>ID: {{ student.id }}</p>

            <p>Name: {{ student.name|upper }}</p>

            <p>Age: {{ student.age }}</p>

        </div>

        <hr>

    {% endfor %}

</body>
</html>
