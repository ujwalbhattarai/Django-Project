{% extends "students/base.html" %}

{% block title %}
    Add Student
{% endblock %}

{% block content %}

    <h2>Add Student</h2>

    <form method="POST">

        {% csrf_token %}

        <label for="name">
            Name:
        </label>

        <input
            type="text"
            id="name"
            name="name"
        >

        <br><br>

        <label for="age">
            Age:
        </label>

        <input
            type="number"
            id="age"
            name="age"
        >

        <br><br>

        <button type="submit">
            Add Student
        </button>

    </form>

    <br>

    <a href="{% url 'students:student-list' %}">
        Back to Students
    </a>

{% endblock %}
